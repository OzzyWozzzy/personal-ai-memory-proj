[project]
name = "temporal-memory-graph"
version = "0.1.0"
description = "Source-grounded temporal memory built on Graphiti, PostgreSQL, and FalkorDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.139.0",
    "pydantic==2.13.4",
    "starlette==1.3.1",
    "uvicorn[standard]==0.50.0",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "dateparser==1.4.1",
    "httpx==0.28.1",
    "anthropic==0.116.0",
    "numpy==2.5.1",
    "fastembed==0.8.0",
    "openai==2.44.0",
    "tenacity==9.1.4",
    "python-dotenv==1.2.2",
    "falkordb==1.6.1",
    "tiktoken==0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.156.1",
    "pgserver==0.1.4",
    "falkordblite==0.10.0",
    "nltk==3.10.0",
]

[project.scripts]
temporal-memory-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

