name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: pip install -e vendor/graphiti -e '.[dev]'
      - name: Python tests
        run: pytest -q
      - name: Frontend contract
        run: |
          node --check frontend/app.js
          node --check frontend/graph.js
          node tests/frontend_graph_layout_probe.cjs
